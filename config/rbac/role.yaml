---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps.devpod.com
  resources:
  - devpods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.devpod.com
  resources:
  - devpods/finalizers
  verbs:
  - update
- apiGroups:
  - apps.devpod.com
  resources:
  - devpods/status
  verbs:
  - get
  - patch
  - update
