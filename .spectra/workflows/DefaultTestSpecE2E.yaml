description: "A default e2e test specification workflow with test review cycle"
entryNode: "HumanApproval"
exitTransitions:
  - fromNode: "DefaultQaSpecReviewerE2E"
    eventType: "ChangesAccepted"
    toNode: "HumanApproval"
nodes:
  - name: "HumanApproval"
    type: "human"
    description: "Human provides git commit hash"
  - name: "DefaultQaAnalystE2E"
    type: "agent"
    agentRole: "DefaultQaAnalystE2E"
    description: "AI analyst drafts the e2e test specification"
  - name: "DefaultQaSpecReviewerE2E"
    type: "agent"
    agentRole: "DefaultQaSpecReviewerE2E"
    description: "AI reviewer evaluates the drafted e2e test specification"
transitions:
  - fromNode: "HumanApproval"
    eventType: "DraftRequested"
    toNode: "DefaultQaAnalystE2E"
  - fromNode: "DefaultQaAnalystE2E"
    eventType: "ClarificationNeeded"
    toNode: "HumanApproval"
  - fromNode: "DefaultQaAnalystE2E"
    eventType: "ReviewNeeded"
    toNode: "DefaultQaSpecReviewerE2E"
  - fromNode: "DefaultQaSpecReviewerE2E"
    eventType: "ChangesRejected"
    toNode: "DefaultQaAnalystE2E"
  - fromNode: "DefaultQaSpecReviewerE2E"
    eventType: "ChangesAccepted"
    toNode: "HumanApproval"
