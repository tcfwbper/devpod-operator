description: "A default implementation workflow (e2e test code only) with code review cycle"
entryNode: "HumanApproval"
exitTransitions:
  - fromNode: "DefaultQaReviewerE2E"
    eventType: "ChangesAccepted"
    toNode: "HumanApproval"
nodes:
  - name: "HumanApproval"
    type: "human"
    description: "Human provides git commit hash"
  - name: "DefaultQaEngineerE2E"
    type: "agent"
    agentRole: "DefaultQaEngineerE2E"
    description: "AI engineer implements the e2e test code"
  - name: "DefaultQaReviewerE2E"
    type: "agent"
    agentRole: "DefaultQaReviewerE2E"
    description: "AI reviewer evaluates the drafted e2e test code"
transitions:
  - fromNode: "HumanApproval"
    eventType: "DraftRequested"
    toNode: "DefaultQaEngineerE2E"
  - fromNode: "DefaultQaEngineerE2E"
    eventType: "ReviewNeeded"
    toNode: "DefaultQaReviewerE2E"
  - fromNode: "DefaultQaReviewerE2E"
    eventType: "ChangesRejected"
    toNode: "DefaultQaEngineerE2E"
  - fromNode: "DefaultQaReviewerE2E"
    eventType: "ChangesAccepted"
    toNode: "HumanApproval"
